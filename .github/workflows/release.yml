name: Publish rule update
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python scripts/rules.py validate
      - run: python -m unittest discover -s tests -v
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from scripts.rules import VERSION
          assert os.environ['RELEASE_TAG'] == 'v' + VERSION, 'tag/version mismatch'
          PY
      - run: python scripts/rules.py build
      - run: git diff --exit-code -- dist
      - name: Upload versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Security rules $RELEASE_TAG" --generate-notes

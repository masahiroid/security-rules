name: Validate rule distribution
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python scripts/rules.py validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/rules.py build
      - run: git diff --exit-code -- dist
      - uses: actions/upload-artifact@v4
        with:
          name: security-rules-2.0.0
          path: dist/
